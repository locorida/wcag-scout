name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code style, static analysis, licences, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: wcag-scout:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Composer install
        run: docker run --rm -v "$PWD:/app" -u "$(id -u):$(id -g)" wcag-scout:dev composer install --no-interaction --no-progress

      - name: Code style
        run: docker run --rm -v "$PWD:/app" -u "$(id -u):$(id -g)" wcag-scout:dev composer cs

      - name: Static analysis
        run: docker run --rm -v "$PWD:/app" -u "$(id -u):$(id -g)" wcag-scout:dev composer analyse

      - name: Licences
        run: docker run --rm -v "$PWD:/app" -u "$(id -u):$(id -g)" wcag-scout:dev composer check:licenses

      - name: Unit tests
        run: docker run --rm -v "$PWD:/app" -u "$(id -u):$(id -g)" wcag-scout:dev composer test
